name: Deploy Presentacion to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'presentacion/**'
      - '.github/workflows/deploy-presentacion.yml'

  # Permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact (solo carpeta presentacion/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './presentacion'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
